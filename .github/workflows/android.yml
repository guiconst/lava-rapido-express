name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Build web e sincronizar com Android
        run: |
          npm run build
          npx cap sync android

      - name: Gerar APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lava-rapido-express.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: lava-rapido-express-apk
          path: lava-rapido-express.apk

      - name: Publicar APK na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK mais recente
          body: APK de debug gerado automaticamente pelo GitHub Actions.
          files: lava-rapido-express.apk
          make_latest: true
